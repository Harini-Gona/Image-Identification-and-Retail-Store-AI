<!DOCTYPE html>
<html>
<head>
    <title>AI Fashion Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>

<style>

/* ===== BASE ===== */
body {
    background: radial-gradient(circle at 20% 20%, #020617, #000000 80%);
    color: #e5e7eb;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

/* ===== SPOTLIGHT EFFECT ===== */
#spotlight {
    position: fixed;
    width: 500px;
    height: 500px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(37,99,235,0.15), transparent 60%);
    transform: translate(-50%, -50%);
    z-index: -1;
}

/* ===== NAVBAR ===== */
.navbar {
    backdrop-filter: blur(16px);
    background: rgba(0,0,0,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* ===== HERO ===== */
.hero {
    text-align: center;
    padding: 120px 20px 60px;
}

.hero-title {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #60a5fa, #2563eb, #1e40af);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero-sub {
    color: #9ca3af;
    margin-top: 12px;
    font-size: 18px;
}

/* ===== CARD (NETFLIX STYLE) ===== */
.glass {
    background: rgba(20, 20, 20, 0.6);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.25s ease;
    transform-style: preserve-3d;
}

/* hover depth */
.glass:hover {
    transform: scale(1.03) translateY(-4px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* ===== IMAGE HOVER ZOOM ===== */
#results img {
    transition: 0.3s ease;
}
#results img:hover {
    transform: scale(1.08);
}

/* ===== BUTTON ===== */
button {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    border-radius: 10px;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(37,99,235,0.3);
}

/* ===== INPUT ===== */
input[type="file"] {
    background: rgba(20,20,20,0.6);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
}

</style>
</head>

<body class="font-sans">
  <div id="spotlight">
</div>

<div class="navbar text-white p-4 flex justify-between sticky top-0 z-50">
    <h1 class="text-xl font-semibold">ClothIQ</h1>

</div>

<div class="hero">
    <div class="hero-title">ClothIQ</div>
    <p class="hero-sub">
        Visual AI Engine for Intelligent Fashion Retrieval
    </p>
</div>

<div class="flex flex-col items-center">
    <input type="file" id="fileInput" class="mb-3">

    <button onclick="search()" type="button"
    class="bg-blue-600 text-white px-6 py-3 rounded shadow hover:scale-105 transition">
        Search
    </button>
</div>

<div id="loader" class="text-center mt-6 hidden">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-black mx-auto"></div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-10">
    <div id="mainImage"></div>
    <div id="details"></div>
</div>

<div class="p-10">
    <h2 class="text-2xl font-bold mb-4">Cart / Bill</h2>
    <div id="cart" class="glass p-4 rounded shadow"></div>
    <h3 id="total" class="font-bold mt-3"></h3>

    <button onclick="goToPayment()" 
    class="bg-green-600 text-white px-6 py-3 rounded mt-4">
        Checkout
    </button>
</div>

<div class="p-10">
    <h2 class="text-2xl font-bold mb-4">Similar Products</h2>
    <div id="results" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</div>


</form>

<script>
    function getColor(c) {
    const map = {
        white: "#ffffff",
        black: "#000000",
        red: "#ff0000",
        blue: "#007bff",
        green: "#28a745",
        yellow: "#ffc107",
        pink: "#ff69b4",
        gray: "#6c757d"
    };
    return map[c] || "#999";
}
    
let cart = JSON.parse(localStorage.getItem("cart")) || [];

async function search() {
    if (window.isSearching) return;
window.isSearching = true;
    let file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Select image first");
        window.isSearching = false; 
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    document.getElementById("loader").classList.remove("hidden");
    
let data;   

try {

    let res = await fetch("http://localhost:8000/search", {
        method: "POST",
        body: formData
    });

    data = await res.json(); 
    if (data.error) {
    alert(data.error);
    return;
}  

    window.currentProduct = data.product;
    window.lastResults = data.results;

} catch (err) {
    console.error(err);
    alert("Server error");
} finally {
    document.getElementById("loader").classList.add("hidden");
    window.isSearching = false;  
}

    document.getElementById("mainImage").innerHTML = `
        <img src="${data.product.image}" class="rounded shadow fade-in">
    `;
    window.selectedDress = data.product.image;

    if (data.new) {
    document.getElementById("details").innerHTML = `
        <div class="glass p-6 rounded shadow">
            <h2 class="text-2xl font-bold text-yellow-400">
                ⚠️ Not in Database
            </h2>
            <p>This image was not found.</p>
            <p class="mt-2">It has been added to the system.</p>
            <p class="mt-2 text-sm text-gray-400">
                Showing similar products below
            </p>
        </div>
    `;
} else {
    document.getElementById("details").innerHTML = `
        <div class="glass p-6 rounded shadow">
            <h2 class="text-2xl font-bold">${data.product.name}</h2>
            <p>Brand: ${data.product.brand}</p>
            <p>ID: ${data.product.id}</p>

            <div class="flex items-center gap-2">
                <span>Color:</span>
                ${data.product.color.split(" & ").map(c => `
    <span style="
        width:15px;
        height:15px;
        background:${getColor(c)};
        border:1px solid #aaa;
        display:inline-block;
        border-radius:50%;
        margin-right:4px;
    "></span>
`).join("")}

            <h3 class="text-green-600 text-xl mt-2">₹${data.product.price}</h3>

            <button onclick="addToCartSingle(${data.product.id}, this)"
            class="bg-black text-white px-4 py-2 mt-3 rounded">
                Add to Cart
            </button>
        </div>
    `;
}

    let resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    data.results.forEach(p => {
        resultsDiv.innerHTML += `
            <div class="glass p-3 rounded shadow">
                <img src="${p.image}" class="rounded mb-2">
                <h3>${p.name}</h3>
                <p class="text-sm text-gray-400">ID: ${p.id}</p>

                ${p.color.split(" & ").map(c => `
    <span style="
        width:12px;
        height:12px;
        background:${getColor(c)};
        border-radius:50%;
        display:inline-block;
        margin-right:3px;
    "></span>
`).join("")}

                <p>₹${p.price}</p>
                <p class="text-xs text-gray-500">Color: ${p.color}</p>

                <button onclick="addToCartSingle(${p.id}, this)"
                class="bg-black text-white px-3 py-1 mt-2 rounded">
                    Add
                </button>
            </div>
        `;
    });
}
let lastAddedId = null;

function addToCartSingle(id, btn) {

    if (lastAddedId === id) return;
    lastAddedId = id;

    let item = null;

    if (window.currentProduct && window.currentProduct.id == id) {
        item = window.currentProduct;
    }

    if (!item && window.lastResults) {
        item = window.lastResults.find(p => p.id == id);
    }

    if (!item) {
        lastAddedId = null;
        return;
    }

    let existing = cart.find(p => p.id == id);

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ ...item, qty: 1 });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCart();

    setTimeout(() => {
        lastAddedId = null;
    }, 300);
}
function updateCart() {
    let div = document.getElementById("cart");
    let total = 0;

    div.innerHTML = "";

    cart.forEach(item => {
        total += item.price * item.qty;

        div.innerHTML += `
        <div class="flex justify-between items-center border-b py-2">
            <div>
                <p>${item.name}</p>
                <p class="text-sm text-gray-500">ID: ${item.id}</p>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="changeQty(${item.id}, -1)" class="px-2 bg-gray-300">-</button>
                <span>${item.qty}</span>
                <button onclick="changeQty(${item.id}, 1)" class="px-2 bg-gray-300">+</button>
            </div>

            <span>₹${item.price * item.qty}</span>
        </div>
        `;
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}

function changeQty(id, change) {
    let item = cart.find(p => p.id === id);

    if (!item) return;

    item.qty += change;

    if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== id);
    }

    updateCart();
    localStorage.setItem("cart", JSON.stringify(cart));
}

function goToPayment() {
    const cartData = encodeURIComponent(JSON.stringify(cart));
    window.location.href = "payment.html?cart=" + cartData;
}

function uploadImage() {
    alert("CLICK WORKED");   // keep this for test

    let fileInput = document.getElementById("imageInput");

    if (!fileInput.files.length) {
        alert("Select image first");
        return;
    }

    let formData = new FormData();
    formData.append("image", fileInput.files[0]);
    

    fetch("/upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        alert("Results: " + data.results);
    })
    .catch(err => {
        alert("Error");
        console.log(err);
    });
    window.onload = function() {
    let dress = document.getElementById("selected_dress");
    if (dress) {
        document.getElementById("cloth_input").value = dress.value;
    }
}
}


</script>
<div id="bg-animation"></div>

<style>
#bg-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

.shape {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent);
    border-radius: 50%;
    filter: blur(40px);
    transition: transform 0.2s ease-out;
}
</style>

<script>
const spotlight = document.getElementById("spotlight");

document.addEventListener("mousemove", (e) => {
    spotlight.style.left = e.clientX + "px";
    spotlight.style.top = e.clientY + "px";
});
</script>



</body>
</html>
